<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cihan POS">
    <title>POS - Satış Ekranı</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
    <header>
        <h1>Cihan Market POS</h1>
        <nav>
            <a href="index.html?v=100">Ana Sayfa</a>
            <a href="pos.html?v=100" class="active">POS</a>
            <a href="arkaofis.html?v=100">Arka Ofis</a>
        </nav>
    </header>

    <!-- Sessiz Bildirim -->
    <div id="posToast" style="display:none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #10b981; color: white; padding: 1rem 2rem; border-radius: 8px; z-index: 9999; font-weight: bold; font-size: 1.2rem; box-shadow: 0 4px 15px rgba(0,0,0,0.3);"></div>

    <div class="app-container">
        <!-- Products Section -->
        <main class="products-section glass-panel">
            <div class="search-bar" style="display: flex; gap: 0.5rem; margin-bottom: 0.5rem;">
                <div style="flex: 1; position: relative;">
                    <i class="fas fa-search" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-secondary);"></i>
                    <input type="text" id="searchInput" class="form-control" style="padding-left: 2.5rem; width: 100%; box-sizing: border-box;" placeholder="Ürün Ara (Barkod veya İsim)...">
                </div>
            </div>

            <div class="action-bar" style="display: flex; gap: 0.5rem; margin-top: 0.5rem; flex-wrap: wrap;">
                <button class="btn btn-outline" onclick="posApp.showParkedCarts()" title="Bekleyen Sepetler" style="flex: 1; color: #f59e0b; border-color: #f59e0b; padding: 0.5rem;">
                    <i class="fas fa-pause-circle"></i> Bekleyen
                </button>
                <button class="btn btn-outline" onclick="posApp.openFastAddModal()" title="Hızlı Ekle" style="flex: 1; padding: 0.5rem;">
                    <i class="fas fa-bolt"></i> Hızlı Ekle
                </button>

            </div>

            <div class="products-scroll-area" style="flex: 1; overflow-y: auto; min-height: 0; padding-right: 0.5rem;">
                <div class="quick-items-grid" id="quickItemsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 0.5rem; margin-top: 1rem; margin-bottom: 0.5rem;">
                    <!-- Hızlı Ürünler injected by JS -->
                </div>

                <div class="products-grid" id="productsGrid" style="overflow-y: visible;">
                    <!-- Products injected by JS -->
                </div>
            </div>
        </main>

        <!-- Cart Section -->
        <aside class="cart-section glass-panel">
            <h2 style="display: flex; justify-content: space-between; align-items: center;">
                <span><i class="fas fa-shopping-cart"></i> Sepet Detayı</span>
            </h2>
            
            <div class="cart-items" id="cartItems">
                <!-- Cart items injected by JS -->
            </div>

            <div class="cart-summary">
                <!-- KDV ve Ara toplam gizlendi -->
                <div class="summary-row total-row">
                    <span>Genel Toplam</span>
                    <span id="grandTotal">0.00 ₺</span>
                </div>
            </div>

            <div class="cart-actions" style="flex-wrap: wrap;">
                <button class="btn btn-warning" onclick="posApp.parkCart()" style="flex:1">
                    <i class="fas fa-pause"></i> Beklet
                </button>
                <button class="btn btn-danger" onclick="posApp.clearCart()" style="flex:1">
                    <i class="fas fa-trash"></i> İptal
                </button>
                <button class="btn btn-info" onclick="posApp.openVeresiyeModal()" style="flex:1; background: #3b82f6; color: white; border: none;">
                    <i class="fas fa-book"></i> Veresiye
                </button>
                <button class="btn btn-success" onclick="posApp.checkout()" style="flex:100%; margin-top: 0.5rem; padding: 1rem; font-size: 1.2rem;">
                    <i class="fas fa-credit-card"></i> PEŞİN ÖDEME AL
                </button>
            </div>
        </aside>
    </div>

    <!-- Bekleyen Sepetler Modal -->
    <div id="parkedModal" class="modal">
        <div class="modal-content glass-panel" style="max-width: 500px;">
            <h2 style="margin-bottom: 1rem; color: var(--secondary-color);">Bekleyen Sepetler</h2>
            <div id="parkedList" style="max-height: 300px; overflow-y: auto; margin-bottom: 1rem;">
                <!-- Parked carts injected here -->
            </div>
            <div style="text-align: right;">
                <button class="btn btn-outline" onclick="document.getElementById('parkedModal').classList.remove('show')">Kapat</button>
            </div>
        </div>
    </div>

    <!-- Hızlı Ürün Ekle Modal -->
    <div id="fastAddModal" class="modal">
        <div class="modal-content glass-panel" style="max-width: 400px;">
            <h2 style="margin-bottom: 1rem; color: var(--secondary-color);">Hızlı Ürün Tanımla</h2>
            <form id="fastAddForm" onsubmit="posApp.saveFastProduct(event)">
                <div class="form-group">
                    <label>Barkod</label>
                    <input type="text" id="fastBarcode" class="form-control" autocomplete="off" placeholder="Barkod Okutun veya Yazın..." maxlength="13">
                </div>
                <div class="form-group">
                    <label>Ürün Adı</label>
                    <input type="text" id="fastName" class="form-control" required autocomplete="off">
                </div>
                <div class="form-group" style="display: flex; gap: 1rem;">
                    <div style="flex: 1;">
                        <label>Fiyat (₺)</label>
                        <input type="number" id="fastPrice" class="form-control" step="0.01" required>
                    </div>
                    <div style="flex: 1;">
                        <label>Stok</label>
                        <input type="number" id="fastStock" class="form-control" value="100" required>
                    </div>
                </div>
                <div class="form-group" style="display: flex; gap: 1rem;">
                    <div style="flex: 1;">
                        <label>Kategori</label>
                        <select id="fastCategory" class="form-control" required>
                            <option value="GENELSTOK">GENELSTOK</option>
                            <option value="KURUYEMİŞ">KURUYEMİŞ</option>
                            <option value="MANAV">MANAV</option>
                            <option value="ŞARKÜTERİ">ŞARKÜTERİ</option>
                        </select>
                    </div>
                    <div style="flex: 1;">
                        <label>KDV Oranı</label>
                        <select id="fastTax" class="form-control" required>
                            <option value="0">%0</option>
                            <option value="1">%1</option>
                            <option value="10">%10</option>
                            <option value="20">%20</option>
                        </select>
                    </div>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="button" class="btn btn-outline" style="flex: 1;" onclick="posApp.closeFastAddModal()">İptal</button>
                    <button type="submit" class="btn btn-success" style="flex: 2;">Kaydet ve Sat</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Kamera Tarayıcı Modal -->
    <div id="cameraModal" class="modal">
        <div class="modal-content glass-panel" style="max-width: 500px; text-align: center;">
            <h2 style="margin-bottom: 1rem; color: var(--secondary-color);"><i class="fas fa-camera"></i> Kamerayla Barkod Okut</h2>
            <div id="reader" style="width: 100%; min-height: 300px; border-radius: 8px; overflow: hidden; margin-bottom: 1rem; background: #fff;"></div>
            <div style="text-align: center;">
                <button class="btn btn-danger" onclick="posApp.closeCameraScanner()" style="width: 100%;">Kapat</button>
            </div>
        </div>
    </div>

    <!-- Terazi Modal -->
    <div id="scaleModal" class="modal">
        <div class="modal-content glass-panel" style="max-width: 400px; text-align: center;">
            <h2 style="margin-bottom: 1rem; color: #10b981;"><i class="fas fa-balance-scale"></i> Terazi Bağlantısı</h2>
            <div style="background: rgba(0,0,0,0.3); border-radius: 12px; padding: 2rem; margin-bottom: 1.5rem;">
                <div style="font-size: 3.5rem; font-weight: bold; font-family: monospace; color: var(--text-primary);" id="modalScaleWeight">0.000</div>
                <div style="color: var(--text-secondary); font-size: 1.2rem; margin-top: 0.5rem;">KG</div>
            </div>
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <button class="btn btn-outline" onclick="document.getElementById('scaleModal').classList.remove('show')" style="flex: 1;">Kapat</button>
                <button class="btn btn-success" id="realConnectScaleBtn" onclick="posApp.triggerScaleConnect()" style="flex: 2;">Teraziye Bağlan</button>
            </div>
        </div>
    </div>

    <!-- Veresiye Modal -->
    <div id="veresiyeModal" class="modal">
        <div class="modal-content glass-panel" style="max-width: 400px;">
            <h2 style="margin-bottom: 1rem; color: #3b82f6;"><i class="fas fa-book"></i> Veresiye Satış</h2>
            <div class="form-group">
                <label>Kayıtlı Müşteri Seç</label>
                <input type="text" id="veresiyeCustomerSearch" class="form-control" placeholder="Müşteri Ara..." style="margin-bottom: 0.5rem;" onclick="posApp.filterVeresiyeCustomers()" onkeyup="posApp.filterVeresiyeCustomers()">
                <select id="veresiyeCustomerSelect" class="form-control" onchange="posApp.handleCustomerSelect()" size="5">
                    <option value="">-- Müşteri Seçin --</option>
                    <option value="new">+ YENİ MÜŞTERİ EKLE</option>
                </select>
            </div>
            <div class="form-group" id="newCustomerGroup" style="display: none;">
                <label>Yeni Müşteri Adı Soyadı</label>
                <input type="text" id="newCustomerName" class="form-control" placeholder="Ad Soyad Giriniz">
            </div>
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button class="btn btn-outline" onclick="posApp.closeVeresiyeModal()" style="flex: 1;">İptal</button>
                <button class="btn btn-primary" onclick="posApp.checkoutVeresiye()" style="flex: 1;">Satışı Tamamla</button>
            </div>
        </div>
    </div>

    <!-- Numpad Modal -->
    <div id="numpadModal" class="modal">
        <div class="modal-content glass-panel" style="max-width: 350px; text-align: center; padding: 1.5rem;">
            <h2 id="numpadTitle" style="margin-bottom: 1rem; color: #fff;">Adet veya KG Girin</h2>
            <div style="background: rgba(0,0,0,0.4); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; border: 1px solid rgba(255,255,255,0.1);">
                <h3 id="numpadDisplay" style="font-size: 2.5rem; margin: 0; color: #10b981;">0</h3>
            </div>
            <input type="hidden" id="numpadProductId">
            <div class="numpad-grid">
                <button class="numpad-btn" onclick="posApp.numpadPress(1)">1</button>
                <button class="numpad-btn" onclick="posApp.numpadPress(2)">2</button>
                <button class="numpad-btn" onclick="posApp.numpadPress(3)">3</button>
                <button class="numpad-btn" onclick="posApp.numpadPress(4)">4</button>
                <button class="numpad-btn" onclick="posApp.numpadPress(5)">5</button>
                <button class="numpad-btn" onclick="posApp.numpadPress(6)">6</button>
                <button class="numpad-btn" onclick="posApp.numpadPress(7)">7</button>
                <button class="numpad-btn" onclick="posApp.numpadPress(8)">8</button>
                <button class="numpad-btn" onclick="posApp.numpadPress(9)">9</button>
                <button class="numpad-btn numpad-clear" onclick="posApp.numpadClear()">C</button>
                <button class="numpad-btn" onclick="posApp.numpadPress(0)">0</button>
                <button class="numpad-btn" style="font-weight: bold; background: rgba(255,255,255,0.1);" onclick="posApp.numpadPress('.')">.</button>
                <button class="numpad-btn numpad-ok" style="grid-column: 1 / span 3; font-size: 1.2rem; margin-top: 5px;" onclick="posApp.numpadConfirm()">OK</button>
            </div>
            <div style="margin-top: 1rem;">
                <button class="btn btn-outline" onclick="posApp.closeNumpad()" style="width: 100%;">İptal</button>
            </div>
        </div>
    </div>

    <!-- Custom Alert/Confirm Modal for POS -->
    <div id="posAlertModal" class="modal" style="z-index: 9999;">
        <div class="modal-content glass-panel" style="max-width: 400px; text-align: center;">
            <div id="posAlertIcon" style="font-size: 3rem; color: #ef4444; margin-bottom: 1rem;"><i class="fas fa-exclamation-circle"></i></div>
            <h2 id="posAlertTitle" style="margin-bottom: 1rem; color: #fff;">Uyarı</h2>
            <p id="posAlertMessage" style="margin-bottom: 1.5rem; color: #94a3b8; line-height: 1.5; white-space: pre-wrap;"></p>
            <div style="display: flex; gap: 1rem;" id="posAlertButtons">
                <button class="btn btn-primary" id="posAlertOkBtn" style="flex: 1;">Tamam</button>
            </div>
        </div>
    </div>

    <!-- MANAV MODAL -->
    <div id="manavModal" class="modal">
        <div class="modal-content glass-panel" style="max-width: 900px; max-height: 90vh; display: flex; flex-direction: column;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2 style="margin: 0; color: #ef4444;"><i class="fas fa-apple-alt"></i> MANAV REYONU</h2>
                <button class="btn btn-outline" onclick="posApp.closeManavModal()" style="border-radius: 50%; width: 40px; height: 40px; padding: 0; display: flex; align-items: center; justify-content: center;"><i class="fas fa-times"></i></button>
            </div>
            
            <div style="overflow-y: auto; flex: 1; padding-right: 0.5rem;">
                <div class="quick-items-grid" id="manavPopuler" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 0.5rem; margin-bottom: 2rem;"></div>
            
            <h3 style="color: #f59e0b; margin-bottom: 0.5rem; border-bottom: 1px dashed rgba(245, 158, 11, 0.3); padding-bottom: 0.5rem;">Meyve Reyonu</h3>
            <div class="quick-items-grid" id="manavMeyveler" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 0.5rem; margin-bottom: 2rem;"></div>
            
            <h3 style="color: #10b981; margin-bottom: 0.5rem; border-bottom: 1px dashed rgba(16, 185, 129, 0.3); padding-bottom: 0.5rem;">Sebze Reyonu</h3>
            <div class="quick-items-grid" id="manavSebzeler" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 0.5rem; margin-bottom: 2rem;"></div>
                </div>
            </div>
    <script src="js/db.js?v=3.1"></script>
    <script src="js/pos.js?v=3.1"></script>
</body>
</html>
